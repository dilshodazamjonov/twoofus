<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1719" media="(prefers-color-scheme: dark)">
<title>Offline</title>
<!-- Shown by the service worker when a page can't load. Static on purpose: it
     contains no personal data, needs no script and works with nothing else cached. -->
<style>
  :root { color-scheme: light dark; --bg:#FFF9F5; --surface:#FFFFFF; --text:#302B2D; --muted:#6A6064; --accent:#813F59; --ink:#FFFFFF; --sage:#B7C9B5; --line:#EFE2DF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1C1719; --surface:#262023; --text:#F7ECEE; --muted:#C4B5BA; --accent:#EBA6BB; --ink:#2B1820; --sage:#8FA88C; --line:#3E3438; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg);
         color:var(--text); font:16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:26rem; text-align:center; background:var(--surface); border:1px solid var(--line);
         border-radius:28px; padding:32px 24px; }
  h1 { font:600 2rem/1.15 "Iowan Old Style", Palatino, Georgia, serif; margin:16px 0 24px; }
  a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 24px;
      border-radius:999px; background:var(--accent); color:var(--ink); text-decoration:none; font-weight:600; }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 13.5V22" stroke="var(--sage)"/>
    <path d="M12 22c0-3 2.2-5.2 5.5-5.2 0 3-2.4 5.2-5.5 5.2Z" stroke="var(--sage)" fill="var(--sage)"/>
    <path d="M12 13.5c2.8 0 5-2.2 5-5V3.5l-2.6 2.2L12 2.5 9.6 5.7 7 3.5v5c0 2.8 2.2 5 5 5Z" stroke="var(--accent)" fill="var(--accent)"/>
  </svg>
  <h1>You&rsquo;re offline</h1>
  <a href="/room">Try again</a>
</main>
</body>
</html>
