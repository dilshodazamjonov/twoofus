[project]
name = "twoofus-backend"
version = "0.1.0"
description = "Two of Us: private now-playing companion for exactly two people (FastAPI backend)."
readme = "README_BACKEND.md"
requires-python = ">=3.12"
license = { text = "Proprietary (personal project)" }
dependencies = [
    "fastapi>=0.162.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "alembic>=1.20.1,<2",
    "aiosqlite>=0.22.1,<1",
    "psycopg[binary]>=3.3.6,<4",
    "httpx>=0.28.1,<1",
    "cryptography>=50.0.2",
    "argon2-cffi>=25.1.0,<26",
    # Unofficial, reverse-engineered client. Pinned EXACTLY on purpose: every
    # upgrade must be re-verified against docs/INTEGRATIONS.md before bumping.
    "yandex-music[async,ynison]==3.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
]

[project.scripts]
twoofus-bootstrap-owner = "app.cli.bootstrap_owner:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs TWOOFUS_TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "TID", "DTZ"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "ASYNC109"]  # fakes mirror library signatures
"alembic/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["betterproto.*", "grpclib.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
